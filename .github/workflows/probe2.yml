name: probe2 (임시 시험 — 확인 후 삭제)
on:
  workflow_dispatch:
    inputs:
      mode:
        default: 'poll'
        required: false
      browser:
        default: '0'
        required: false
jobs:
  parity:
    # 아래 if 줄은 reservation_report.yml의 것을 글자 그대로 복사
    if: ${{ github.event.inputs.mode != 'poll' || endsWith(format('{0}', github.run_number), '00') || endsWith(format('{0}', github.run_number), '04') || endsWith(format('{0}', github.run_number), '08') || endsWith(format('{0}', github.run_number), '12') || endsWith(format('{0}', github.run_number), '16') || endsWith(format('{0}', github.run_number), '20') || endsWith(format('{0}', github.run_number), '24') || endsWith(format('{0}', github.run_number), '28') || endsWith(format('{0}', github.run_number), '32') || endsWith(format('{0}', github.run_number), '36') || endsWith(format('{0}', github.run_number), '40') || endsWith(format('{0}', github.run_number), '44') || endsWith(format('{0}', github.run_number), '48') || endsWith(format('{0}', github.run_number), '52') || endsWith(format('{0}', github.run_number), '56') || endsWith(format('{0}', github.run_number), '60') || endsWith(format('{0}', github.run_number), '64') || endsWith(format('{0}', github.run_number), '68') || endsWith(format('{0}', github.run_number), '72') || endsWith(format('{0}', github.run_number), '76') || endsWith(format('{0}', github.run_number), '80') || endsWith(format('{0}', github.run_number), '84') || endsWith(format('{0}', github.run_number), '88') || endsWith(format('{0}', github.run_number), '92') || endsWith(format('{0}', github.run_number), '96') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "실행됨 run_number=${{ github.run_number }}"
  browser:
    if: ${{ github.event.inputs.browser == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # 2026-10-13 시험 결과 — 시스템 Chrome은 설치 없이 0.9초에 실행되고, 설치는 43초 걸린다
      - name: 브라우저 준비 (시스템 Chrome이 있으면 설치 생략)
        run: |
          if [ -x /opt/google/chrome/chrome ]; then echo "시스템 Chrome 사용 — 설치 생략"; else npx playwright install chromium chrome --with-deps; fi
      - name: playwright 패키지
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.60 --silent
      - name: sync_daily_close.js 와 같은 방식으로 실행 (Chrome 우선, 실패 시 Edge, 번들 Chromium)
        working-directory: /tmp/pw
        run: |
          cat > t1.js <<'EOF2'
          const { chromium } = require('playwright');
          (async () => {
            const opts = { headless: true, args: ['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-gpu','--disable-extensions','--no-first-run'] };
            for (const ch of ['chrome', 'msedge', null]) {
              try {
                const b = await Promise.race([chromium.launch(ch ? { ...opts, channel: ch } : opts), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 30000))]);
                const p = await b.newPage(); await p.goto('data:text/html,<title>ok</title>');
                console.log('브라우저:', ch ?? 'chromium', 'OK', b.version(), await p.title()); await b.close(); return;
              } catch (e) { console.log((ch ?? 'chromium') + ' 실패:', String(e.message).split(String.fromCharCode(10))[0]); }
            }
            console.log('브라우저 실행 실패'); process.exit(1);
          })();
          EOF2
          node t1.js
      - name: 번들 Chromium만 설치 후 category_sales.js 와 같은 방식으로 실행
        working-directory: /tmp/pw
        run: |
          npx playwright install chromium
          cat > t2.js <<'EOF3'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const p = await b.newPage(); await p.goto('data:text/html,<title>ok</title>');
            console.log('번들 Chromium OK', b.version(), await p.title()); await b.close();
          })().catch(e => { console.log('번들 실패', String(e.message).split(String.fromCharCode(10))[0]); process.exit(1); });
          EOF3
          node t2.js
