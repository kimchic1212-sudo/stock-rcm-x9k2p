name: pw-probe (임시 시험 — 확인 후 삭제)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 시스템 Chrome 확인
        run: |
          ls -la /opt/google/chrome/chrome || echo "NO /opt/google/chrome/chrome"
          google-chrome --version || true
      - name: playwright 설치(npm)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && s=$(date +%s) && npm i playwright@1.60 --silent && echo "npm i $(( $(date +%s)-s ))s"
      - name: 시스템 Chrome만으로 실행(브라우저 설치 없이)
        working-directory: /tmp/pw
        run: |
          node -e "(async()=>{const {chromium}=require('playwright');const t=Date.now();const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const p=await b.newPage();await p.goto('data:text/html,<title>ok</title>');console.log('chrome channel OK',Date.now()-t,'ms',b.version(),await p.title());await b.close()})().catch(e=>{console.log('chrome channel FAIL',e.message);process.exit(1)})"
      - name: 번들 Chromium을 deps 없이 설치 후 실행
        working-directory: /tmp/pw
        run: |
          s=$(date +%s); npx playwright install chromium; echo "install chromium(no deps) $(( $(date +%s)-s ))s"
          node -e "(async()=>{const {chromium}=require('playwright');const t=Date.now();const b=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const p=await b.newPage();await p.goto('data:text/html,<title>ok</title>');console.log('bundled chromium OK(no deps)',Date.now()-t,'ms',b.version());await b.close()})().catch(e=>{console.log('bundled chromium FAIL(no deps)',String(e.message).split('\n')[0]);process.exit(0)})"
      - name: 번들 Chromium --with-deps 시간(비교용)
        working-directory: /tmp/pw
        run: |
          s=$(date +%s); npx playwright install chromium --with-deps >/dev/null 2>&1; echo "install chromium --with-deps $(( $(date +%s)-s ))s"
